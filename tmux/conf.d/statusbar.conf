# Status bar settings
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-style bg=default,fg=white

# Left side
set -g status-left-length 60
set -g status-left "#[fg=cyan]  #S #[fg=white]| #[fg=green] #(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '') "

# Right side
set -g status-right-length 150
set -g status-right "#[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M #[fg=white]| #[fg=magenta] #h "

# Window status
set-window-option -g window-status-current-format "#[fg=black,bg=green] #I:#W #[default]"
set-window-option -g window-status-format "#[fg=white] #I:#W "
